behaviors:
  # Must match BehaviorParameters.BehaviorName on the RoverAgent prefab.
  TruckBrain:
    trainer_type: ppo

    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      # Halved for fine-tuning: the policy already drives, this run only
      # sharpens it rather than re-exploring from scratch.
      learning_rate: 0.00015
      beta: 0.002
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear

    network_settings:
      # The observations mix clamped velocities with raw ground normals and
      # ray distances, so running normalization is worth having.
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0

    keep_checkpoints: 10
    checkpoint_interval: 500000
    # Matches the intended budget, so the linear schedules on learning
    # rate, beta and epsilon actually reach zero before the run ends.
    max_steps: 1500000
    # Episodes run up to 5000 steps and the arrival reward only lands at the
    # very end, so the value function needs a long horizon.
    time_horizon: 256
    summary_freq: 20000
    threaded: false

env_settings:
  num_envs: 1
  base_port: 5005
  seed: -1

engine_settings:
  width: 84
  height: 84
  quality_level: 0
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false
