behaviors:
  My Behavior:
    trainer_type: ppo

    hyperparameters:
      # 2048 is appropriate when using multiple parallel environments.
      # If training is unstable or hardware is limited, try 1024.
      batch_size: 2048
      buffer_size: 20480

      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3

      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear

    network_settings:
      # Useful when observations contain values with different scales:
      # position, velocity, angles, angular velocity, ray distances, etc.
      normalize: true

      hidden_units: 256
      num_layers: 2

      # Relevant when using visual observations.
      # For vector-only observations this has little practical effect.
      vis_encode_type: simple

      # Enable this only if the drone has partial observability.
      # For example, if velocity, angular velocity, or target direction
      # cannot be observed directly.
      memory:
        sequence_length: 64
        memory_size: 256

    reward_signals:
      extrinsic:
        strength: 1.0

        # Good for long-horizon waypoint and landing tasks.
        gamma: 0.995

    keep_checkpoints: 10
    checkpoint_interval: 500000

    # Five million steps is a starting point, not a guarantee of convergence.
    max_steps: 5000000

    # If one decision represents approximately 0.02 seconds,
    # 128 decisions represent about 2.56 seconds of experience.
    time_horizon: 128

    summary_freq: 20000
    threaded: false

env_settings:
  env_path: null
  base_port: 5005

  # Use 8 if the machine can run eight instances reliably.
  # Reduce to 4 or 1 if simulation speed becomes unstable.
  num_envs: 1

  num_areas: 1
  timeout_wait: 60
  seed: -1

engine_settings:
  width: 84
  height: 84
  quality_level: 0
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true

checkpoint_settings:
  run_id: DronePPO
  resume: false
  force: false
  inference: false
  results_dir: results

debug: false